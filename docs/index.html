<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taskflow</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { max-width: 46rem; margin: 5rem auto; padding: 0 1.5rem; color: #172033; }
      h1 { color: #2563eb; font-size: 3rem; margin-bottom: .25rem; }
      .tag { color: #526079; font-size: 1.15rem; }
      code { background: #edf2ff; border-radius: .25rem; padding: .15rem .35rem; }
    </style>
  </head>
  <body>
    <h1>Taskflow</h1>
    <p class="tag">Un gestor de tareas simple, probado y desplegado automáticamente.</p>
    <h2>Características</h2>
    <ul>
      <li>Crear y completar tareas.</li>
      <li>Eliminar tareas con <code>eliminar(tareas, indice)</code>.</li>
      <li>Pruebas automáticas con GitHub Actions.</li>
    </ul>
  </body>
</html>
